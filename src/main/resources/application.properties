spring.config.import=optional:file:.env[.properties]

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.allowed-chat-id=${TELEGRAM_BOT_ALLOWED_CHAT_ID}

itad.api-key=${ITAD_API_KEY}
itad.country=BR
itad.steam-shop-id=61

spring.datasource.url=${BD_URL}
spring.datasource.username=${BD_USERNAME}
spring.datasource.password=${BD_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.jackson.time-zone=America/Maceio
